name: Apply autorig fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch store
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('src/lib/puppet/store.ts'); s=p.read_text()
          s,n=re.subn(r'if \(!get\(\)\.attachments\.length \|\| get\(\)\.attachmentsNeedReview\) \{\s*void get\(\)\.cutPaper\(\);', 'if (!get().attachments.length && !get().busy) {\n        void get().cutPaper();', s, count=1)
          if n!=1: raise SystemExit('setStep target not found')
          s,n=re.subn(r'(deleteJoint: \(id\) => \{.*?selectedId: selectedId === id \? null : selectedId,\n)(\s*jointVersion: jointVersion \+ 1,)', r'\1      attachments: attachments.filter((attachment) => attachment.boneId !== id),\n\2', s, count=1, flags=re.S)
          if n!=1: raise SystemExit('deleteJoint target not found')
          s,n=re.subn(r'(autoPin: async \(\) => \{.*?set\(\{\s*joints,\s*selectedId: joints\[0\]\?\.id \?\? null,\s*jointVersion: get\(\)\.jointVersion \+ 1,\n)\s*attachments: \[\],\n(\s*attachmentsNeedReview: true,)', r'\1\2', s, count=1, flags=re.S)
          if n!=1: raise SystemExit('autoPin target not found')
          s,n=re.subn(r'(cutPaper: async \(\) => \{\n)\s*(const \{ source, joints, bg \} = get\(\);)', r'\1    const draftVersion = get().jointVersion;\n    \2', s, count=1)
          if n!=1: raise SystemExit('cutPaper start not found')
          s,n=re.subn(r'(attachments: parts,\n\s*attachmentsNeedReview:) false,(\n\s*partDraftVersion:) get\(\)\.jointVersion,', r'\1 get().jointVersion !== draftVersion,\2 draftVersion,', s, count=1)
          if n!=1: raise SystemExit('cutPaper completion not found')
          p.write_text(s)
          PY
      - name: Verify
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/puppet/store.ts
          git rm .github/workflows/autorig-apply-fixes.yml
          git commit -m "fix: preserve cutouts across rig edits"
          git push
