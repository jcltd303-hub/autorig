name: AI Pipeline CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "ai-pipeline-multimodel"]
  pull_request:
    paths:
      - "src/lib/ai/**"
      - "src/lib/puppet/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ai-pipeline-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
